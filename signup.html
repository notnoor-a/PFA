<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Medic — Inscription</title>
  <link rel="stylesheet" href="signup.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<div class="page">

  <!-- HERO -->
  <div class="hero">
    <div class="logo-icon">+</div>
    <span class="logo-text">Smart Medic</span>

    <h1>Créer votre <span>compte</span></h1>
    <p>Rejoignez Smart Medic pour suivre votre santé<br>et accéder à nos services intelligents.</p>
  </div>

  <!-- SIGNUP CARD -->
  <div class="center">
    <div class="card">

      <div class="card-header">
        <h2>Inscription</h2>
        <p>Remplissez les informations ci-dessous.</p>
      </div>

      <div class="error-msg" id="errorMsg">
        Une erreur est survenue.
      </div>

      <form id="signupForm" novalidate>

        <div class="form-group">
          <label for="name">Nom complet</label>
          <input type="text" id="name" placeholder="Votre nom" required />
        </div>

         <div class="form-group">
          <label for="date">Date de naissance</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" placeholder="exemple@email.com" required />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="••••••••" required />
            <button type="button" class="toggle-pw" id="togglePw">
              👁
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm">Confirmer le mot de passe</label>
          <input type="password" id="confirm" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-login" id="signupBtn">
          <span class="btn-text">Créer un compte</span>
          <div class="spinner"></div>
        </button>

      </form>

      <div class="signup-link">
        Vous avez déjà un compte ?
        <a href="index.html">Se connecter</a>
      </div>

    </div>
  </div>

</div>

<script>
  const form = document.getElementById('signupForm');
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('signupBtn');

  // Toggle password
  const togglePw = document.getElementById('togglePw');
  const pwInput = document.getElementById('password');

  togglePw.addEventListener('click', () => {
    pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (!name || !email || !pw || !confirm) {
      errorMsg.textContent = "Veuillez remplir tous les champs.";
      errorMsg.classList.add('show');
      return;
    }

    if (pw.length < 6) {
      errorMsg.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
      errorMsg.classList.add('show');
      return;
    }

    if (pw !== confirm) {
      errorMsg.textContent = "Les mots de passe ne correspondent pas.";
      errorMsg.classList.add('show');
      return;
    }

    btn.classList.add('loading');
    await new Promise(r => setTimeout(r, 1500));
    btn.classList.remove('loading');

    // Redirection après inscription
    window.location.href = "index.html";
  });
</script>

</body>
</html>
